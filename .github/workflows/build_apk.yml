name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Pin to ubuntu-24.04 for stable package availability and reproducibility
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.10 (matches our development environment) ──
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 3. Temurin Java 17 (no PPA, no apt issues, works on all Ubuntu) ──
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Cache the heavy Android SDK / NDK downloads ──
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 5. Install ONLY what apt-get can reliably provide on Ubuntu 24.04 ──
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf libtool automake pkg-config cmake \
            libffi-dev libssl-dev zlib1g-dev \
            libsqlite3-dev sqlite3 \
            libltdl-dev

      # ── 6. Install Buildozer & Cython ──
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer

      # ── 7. Build the Android debug APK ──
      - name: Build Android APK
        run: |
          buildozer -v android debug 2>&1

      # ── 8. Upload APK as downloadable artifact ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockPredictor-Android-APK
          path: bin/*.apk
          retention-days: 14
